enable: true
messageFormat: array          # array | string
role: Universal
reportSelfMessage: true
accessToken: ""
reconnectInterval: 5000
heartbeatInterval: 10000
debug: true

presets:
  # ── 插件主动连出（reverse-ws）─────────────────────────────
  # 插件作为 WS 客户端，主动连接到 SnowLuma 的 WS 服务端
  - name: snowluma-local
    type: reverse
    url: "ws://localhost:3001/"
    desc: "连接本机 SnowLuma 正向 WS 服务（同一台机器时使用）"

  - name: snowluma-docker
    type: reverse
    url: "ws://snowluma:3001/"
    desc: "连接同一 Docker 网络中的 SnowLuma（通过服务名）"

  - name: host-internal
    type: reverse
    url: "ws://host.docker.internal:3001/"
    desc: "容器内连接宿主机上的 SnowLuma（Docker Desktop 适用）"

  # ── 插件本地监听（协议端 WS 客户端主动连入）──────────────
  # 插件开启 WS 服务端，SnowLuma 在「WS 客户端」页签配置地址连过来
  - name: adapter-forward
    type: forward
    host: "0.0.0.0"
    port: 3002
    path: "/"
    desc: "插件本地监听服务（SnowLuma WS 客户端主动连入时使用）"

# 启动时自动激活的预设（填预设的 name）
# 默认使用 snowluma-local：插件主动连接到 SnowLuma 的 WS 服务端
# Docker 跨网络时改为对应地址，或用 #添加连接 ws://地址 手动指定
active:
  - snowluma-local
