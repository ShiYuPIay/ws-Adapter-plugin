<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="5;url=https://ws-adapter-plugin.github.io/">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#07131b">
  <link rel="canonical" href="https://ws-adapter-plugin.github.io/">
  <title>教学网站已迁移｜ws-Adapter</title>
  <style>
    :root { --ink:#07131b; --panel:#0d232d; --paper:#f3f0e7; --cyan:#35d7c5; --orange:#ffad42; --muted:#8ca0a4; }
    * { box-sizing:border-box; }
    body {
      display:grid; min-height:100vh; margin:0; place-items:center; padding:24px;
      color:var(--paper); background:
        linear-gradient(rgba(53,215,197,.04) 1px,transparent 1px),
        linear-gradient(90deg,rgba(53,215,197,.04) 1px,transparent 1px),
        var(--ink); background-size:24px 24px;
      font-family:"MiSans","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    }
    main { width:min(760px,100%); border:1px solid #28404a; background:rgba(13,35,45,.94); box-shadow:18px 18px 0 rgba(0,0,0,.22); }
    .route { display:flex; align-items:center; gap:12px; padding:18px 24px; color:var(--cyan); border-bottom:1px solid #28404a; font:800 11px "Cascadia Code",Consolas,monospace; letter-spacing:.12em; }
    .route i { width:8px; height:8px; border-radius:50%; background:var(--cyan); box-shadow:0 0 0 6px rgba(53,215,197,.1); }
    .route span { flex:1; height:1px; background:linear-gradient(90deg,var(--cyan),transparent); }
    .content { padding:clamp(34px,8vw,72px); }
    .eyebrow { color:var(--orange); font:800 11px "Cascadia Code",Consolas,monospace; letter-spacing:.12em; }
    h1 { margin:18px 0; font-size:clamp(42px,8vw,76px); letter-spacing:-.07em; line-height:.98; }
    h1 em { color:var(--cyan); font-style:normal; }
    p { max-width:590px; color:var(--muted); font-size:17px; line-height:1.8; }
    code { color:var(--cyan); font-family:"Cascadia Code",Consolas,monospace; overflow-wrap:anywhere; }
    .actions { display:flex; gap:12px; align-items:center; margin-top:32px; flex-wrap:wrap; }
    a.primary { display:inline-flex; min-height:50px; align-items:center; padding:0 22px; color:var(--ink); background:var(--orange); font-weight:900; text-decoration:none; box-shadow:5px 5px 0 rgba(255,173,66,.18); }
    a.primary:hover,a.primary:focus-visible { background:#ffc06e; transform:translateY(-2px); }
    a.repo { color:var(--muted); font-size:13px; }
    #countdown { color:var(--paper); font-weight:800; }
    footer { padding:14px 24px; color:#667b80; border-top:1px solid #28404a; font-size:11px; }
    :focus-visible { outline:3px solid var(--cyan); outline-offset:4px; }
    @media (max-width:520px) { .content{padding:34px 24px}.actions{align-items:stretch;flex-direction:column}.actions a{text-align:center;justify-content:center} }
    @media (prefers-reduced-motion:reduce) { *{scroll-behavior:auto!important;transition:none!important} }
  </style>
</head>
<body>
  <main>
    <div class="route"><i aria-hidden="true"></i> ROUTE MOVED <span aria-hidden="true"></span> HTTP 301 COMPAT</div>
    <div class="content">
      <span class="eyebrow">ws-Adapter · 教学入口更新</span>
      <h1>线路已迁移到<br><em>新地址。</em></h1>
      <p>零基础接线手册已经迁移到独立的公开网站。<span id="countdown" aria-live="polite">3 秒后自动前往</span>，也可以立即点击下面的按钮。</p>
      <p><code>https://ws-adapter-plugin.github.io/</code></p>
      <div class="actions">
        <a class="primary" href="https://ws-adapter-plugin.github.io/">立即前往新网站 →</a>
        <a class="repo" href="https://github.com/ShiYuPIay/ws-Adapter-plugin">返回插件仓库</a>
      </div>
      <noscript><p>浏览器已禁用 JavaScript，请使用上方“立即前往新网站”链接。</p></noscript>
    </div>
    <footer>旧地址仅用于兼容已有收藏与外部链接。</footer>
  </main>
  <script>
    const label = document.querySelector('#countdown')
    let remaining = 3
    const timer = window.setInterval(() => {
      remaining -= 1
      if (remaining > 0) {
        label.textContent = `${remaining} 秒后自动前往`
        return
      }
      window.clearInterval(timer)
      label.textContent = '正在前往新网站'
      window.location.replace('https://ws-adapter-plugin.github.io/')
    }, 1000)
  </script>
</body>
</html>
